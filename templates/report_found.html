{% extends 'base.html' %}
{% block content %}
<section class="page">
    <div class="container">
        <div class="form-wrap">
            <h1>Report Found Item</h1>
            <p class="private-note">Private photo and verification answers will be kept private. They are not shown on the public found-items list.</p>
            <form method="POST" enctype="multipart/form-data">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="item_name">Item Name</label>
                        <input type="text" id="item_name" name="item_name" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" name="category" required>
                            <option value="Bag">Bag</option>
                            <option value="Phone">Phone</option>
                            <option value="Keys">Keys</option>
                            <option value="Wallet">Wallet</option>
                            <option value="Book">Book</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="location">Location</label>
                        <input type="text" id="location" name="location" required>
                    </div>
                    <div class="form-group">
                        <label for="photo">Private Photo</label>
                        <input type="file" id="photo" name="photo" accept="image/*">
                    </div>
                    <div class="form-group full">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" required></textarea>
                    </div>

                    <div class="form-group full">
                        <h3>Private Verification Questions</h3>
                    </div>

                    <div class="form-group">
                        <label for="question1">Question 1</label>
                        <input type="text" id="question1" name="question1" value="What is attached to the backpack?" required>
                    </div>
                    <div class="form-group">
                        <label for="answer1">Answer 1</label>
                        <input type="text" id="answer1" name="answer1" value="Red keychain" required>
                    </div>

                    <div class="form-group">
                        <label for="question2">Question 2</label>
                        <input type="text" id="question2" name="question2" value="What sticker is inside the backpack?" required>
                    </div>
                    <div class="form-group">
                        <label for="answer2">Answer 2</label>
                        <input type="text" id="answer2" name="answer2" value="Superman" required>
                    </div>

                    <div class="form-group">
                        <label for="question3">Question 3</label>
                        <input type="text" id="question3" name="question3" value="Where is the scratch?" required>
                    </div>
                    <div class="form-group">
                        <label for="answer3">Answer 3</label>
                        <input type="text" id="answer3" name="answer3" value="Left side" required>
                    </div>
                </div>
                <div class="btn-row">
                    <button class="btn btn-primary" type="submit">Save Found Item</button>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
